# Render Blueprint — 저장소를 연결하면 이 설정대로 배포된다.
# CHAT_API_KEY / GEMINI_API_KEY 는 Render 대시보드에서 직접 입력한다.
# (sync: false 로 두면 저장소에 값이 커밋되지 않는다)

services:
  - type: web
    name: moveai-carrier-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEV_MODE
        value: "false"
      - key: DEMO_CARRIER_ID
        value: CARRIER_A
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_API_URL
        sync: false
      - key: CHAT_API_KEY
        sync: false
